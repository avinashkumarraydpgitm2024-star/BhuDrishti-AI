<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bhudrishti Risk Map - Sikkim</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;color:#14262b;background:#f3f5f2}
#home{max-width:720px;margin:0 auto;padding:12vh 24px}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}
.lede{color:#41575c;max-width:52ch}
.counts{display:flex;gap:20px;margin:28px 0;flex-wrap:wrap}
.counts span{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
button{font:inherit;cursor:pointer;border:1px solid #0d5c63;background:#fff;color:#0d5c63;border-radius:8px;padding:8px 14px}
button.primary{background:#0d5c63;color:#fff;font-size:1.1rem;padding:12px 22px}
button:focus-visible,input:focus-visible{outline:3px solid #f2b100;outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#app[hidden]{display:none}
#bar{display:flex;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #d5ddd8;flex-wrap:wrap}
#q{flex:1 1 200px;min-width:0;font:inherit;padding:8px 12px;border:1px solid #9fb0b3;border-radius:8px}
#map{flex:1;background:#dfe7e3}
#legend{position:absolute;left:12px;bottom:28px;z-index:1000;display:flex;flex-direction:column;gap:4px;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.25);font-size:.85rem}
#status{position:absolute;right:12px;bottom:28px;z-index:1000;max-width:min(60vw,360px);background:#14262b;color:#fff;padding:8px 12px;border-radius:8px;font-size:.85rem}
#status:empty{display:none}
.pop h3{margin:0 0 4px;font-size:1.05rem}
.badge{border-radius:99px;padding:1px 10px;font-size:.8rem}
.pop p{margin:6px 0}
.pop small,.note{color:#5c6f73}
table{border-collapse:collapse;width:100%}td{padding:8px;border-bottom:1px solid #e1e7e3;vertical-align:top}
</style></head><body>
<section id="home">
  <h1>Sikkim's landslide and flood hotspots, mapped</h1>
  <p class="lede">30 locations researched from official SSDMA records. Search a place, see where you are, and check the warning, safe place and alternative route before you travel.</p>
  <div class="counts"></div>
  <button class="primary" id="see">See the Map</button>
  <p class="note">Ratings are a research classification, not a live government alert.</p>
</section>
<section id="app" hidden>
  <div id="bar">
    <input id="q" list="names" placeholder="Search a location or district" autocomplete="off" aria-label="Search location">
    <datalist id="names"></datalist>
    <button id="go">Search</button><button id="loc">My location</button><button id="fs">Full screen</button><button id="close">Back</button>
  </div>
  <div id="map"></div><div id="legend"></div><div id="status" role="status"></div>
</section>
<script src="locations.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const COL={High:'#c62828',Medium:'#f2b100',Low:'#2e7d32'},NAME={High:'Red',Medium:'Yellow',Low:'Green'},$=s=>document.querySelector(s);
let DATA=[],map,mk={},me,ready=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>{$('#status').textContent=t};
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,k=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(k))};
async function load(){
  try{const r=await fetch('data/locations.json',{cache:'no-store'});if(!r.ok)throw 0;DATA=await r.json()}
  catch(e){DATA=window.OFFLINE_LOCATIONS||[];say('Data file not reachable - showing offline sample data.')}
  const h=['High','Medium','Low'].map(l=>`<span><i class="dot" style="background:${COL[l]}"></i>${NAME[l]}: ${DATA.filter(d=>d.level===l).length}</span>`).join('');
  $('.counts').innerHTML=h;$('#legend').innerHTML=h+'<small>Research rating, not a live alert.</small>';
  $('#names').innerHTML=DATA.map(d=>`<option value="${esc(d.name)}">`).join('');
}
const pop=d=>`<div class="pop"><h3>${esc(d.name)}</h3><span class="badge" style="background:${COL[d.level]};color:${d.level==='Medium'?'#000':'#fff'}">${esc(d.level)} risk</span> <small>${esc(d.district)} - ${esc(d.category)}</small>
<p><b>Warning:</b> ${esc(d.warning)}</p><p><b>Nearby safe place:</b> ${esc(d.safe)}</p><p><b>Alternative route:</b> ${esc(d.alt)}</p>
<details><summary>Why this rating</summary><p>${esc(d.reason)}</p><p><b>Warning signs:</b> ${esc(d.signs)}</p></details>
<p><a href="${esc(d.src)}" target="_blank" rel="noopener">Official source</a><br><small>${esc(d.section)}</small></p><small>${esc(d.acc)}. Not a live alert.</small></div>`;
function list(){$('#map').innerHTML='<div style="padding:16px;overflow:auto;height:100%;background:#fff"><table>'+DATA.map(d=>`<tr><td><i class="dot" style="background:${COL[d.level]}"></i></td><td><b>${esc(d.name)}</b> <small>${esc(d.district)}</small><br>${esc(d.warning)}</td></tr>`).join('')+'</table></div>'}
function init(){
  if(ready)return;ready=true;
  if(!window.L){list();say('Map library unavailable offline - showing list of locations.');return}
  map=L.map('map').setView([27.4,88.55],9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenStreetMap'}).on('tileerror',()=>say('Map tiles unavailable - markers still work.')).addTo(map);
  DATA.forEach(d=>{mk[d.id]=L.circleMarker([d.lat,d.lon],{radius:9,color:'#fff',weight:2,fillColor:COL[d.level],fillOpacity:.95}).bindPopup(pop(d),{maxWidth:320}).addTo(map)});
  map.fitBounds(DATA.map(d=>[d.lat,d.lon]),{padding:[40,40]});
}
const fs=async on=>{try{on?await document.documentElement.requestFullscreen():await document.exitFullscreen()}catch(e){}};
$('#see').onclick=()=>{$('#home').hidden=true;$('#app').hidden=false;init();map&&map.invalidateSize();fs(true)};
$('#close').onclick=()=>{$('#app').hidden=true;$('#home').hidden=false;document.fullscreenElement&&fs(false)};
$('#fs').onclick=()=>fs(!document.fullscreenElement);
async function search(){
  const q=$('#q').value.trim().toLowerCase();if(!q)return;
  const d=DATA.find(x=>x.name.toLowerCase().includes(q))||DATA.find(x=>(x.district+' '+x.category).toLowerCase().includes(q));
  if(d&&map){map.flyTo([d.lat,d.lon],13);mk[d.id].openPopup();say('');return}
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q='+encodeURIComponent(q+', Sikkim'));
    const j=await r.json();if(!j.length)throw 0;map.flyTo([+j[0].lat,+j[0].lon],12);say('Showing: '+j[0].display_name)}
  catch(e){say('No match in the 30 researched locations, and online search is unavailable.')}
}
$('#go').onclick=search;$('#q').onkeydown=e=>e.key==='Enter'&&search();$('#q').onchange=search;
$('#loc').onclick=()=>{
  if(!navigator.geolocation)return say('Location is not supported in this browser.');
  say('Finding your location...');
  navigator.geolocation.getCurrentPosition(p=>{
    const a=p.coords.latitude,o=p.coords.longitude;
    if(map){me&&me.remove();me=L.circleMarker([a,o],{radius:8,color:'#fff',weight:3,fillColor:'#1565c0',fillOpacity:1}).addTo(map).bindPopup('You are here');map.flyTo([a,o],11)}
    const n=DATA.map(d=>({d,km:hav(a,o,d.lat,d.lon)})).sort((x,y)=>x.km-y.km)[0];
    say(`Nearest researched site: ${n.d.name} (${n.km.toFixed(1)} km, ${n.d.level} risk).`);
  },()=>say('Could not get your location. Allow location access (needs https or localhost).'),{enableHighAccuracy:true,timeout:10000});
};
load();
</script></body></html>
