<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="light dark" name="color-scheme"/>
  <meta content="#f4f7f4" name="theme-color"/>
  <title>
   BhuDrishti AI | Verify
  </title>
  <link href="css/base.css" rel="stylesheet"/>
  <link href="css/theme.css" rel="stylesheet"/>
  <script>
   try{document.documentElement.setAttribute('data-theme',localStorage.getItem('bhudrishtiTheme')==='dark'?'dark':'light')}catch(e){}
  </script>
  <link href="css/responsive-fixes.css" rel="stylesheet"/>
  <link href="css/final-polish.css" rel="stylesheet"/>
 </head>
 <body class="page-verify">
  <div class="auth-page">
   <section class="auth-visual">
    <div class="auth-brand">
     <a class="logo" href="index.html">
      <span class="logo-mark">
       <svg fill="none" viewbox="0 0 32 32">
        <path d="M5 16c4.4-7.1 10-9.5 16.8-7.2 2.3.8 4.1 2.1 5.2 3.9-3.1 7.5-8.6 11.2-16.5 8.6L5 16Z" stroke="currentColor" stroke-width="2.2">
        </path>
        <circle cx="18" cy="14" fill="currentColor" r="3">
        </circle>
       </svg>
      </span>
      <span>
       <div class="logo-title">
        BHU
        <span>
         DRISHTI
        </span>
       </div>
       <div class="logo-sub">
        AI
       </div>
      </span>
     </a>
    </div>
    <div class="auth-copy">
     <h1 data-i18n="verifyVisualTitle">
     </h1>
     <p data-i18n="verifyVisualDesc">
     </p>
    </div>
    <div class="auth-foot" data-i18n="verifyFoot">
    </div>
   </section>
   <main class="auth-panel">
    <div class="auth-card">
     <div class="auth-top">
      <select class="lang-select" data-lang-select="">
       <option value="en">
        English
       </option>
       <option value="hi">
        हिंदी
       </option>
       <option value="hinglish">
        Hinglish
       </option>
      </select>
      <button aria-label="Theme" class="icon-btn" data-theme-toggle="" type="button">
       <span data-icon="theme">
       </span>
      </button>
     </div>
     <h2 data-i18n="verifyTitle">
     </h2>
     <p class="sub">
      <span data-i18n="verifySub">
      </span>
      <strong id="verifyEmail">
       rohit@example.com
      </strong>
     </p>
     <form id="verifyForm">
      <div class="otp-row">
       <input class="otp" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
       <input class="otp" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
       <input class="otp" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
       <input class="otp" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
       <input class="otp" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
       <input class="otp" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
      </div>
      <div class="error" id="verifyError">
      </div>
      <div class="auth-actions">
       <button class="btn btn-primary" data-i18n="verify">
       </button>
      </div>
     </form>
     <div class="auth-note" data-i18n="verifyNote">
     </div>
     <div class="auth-link">
      <button data-i18n="resend" id="resendBtn" type="button">
      </button>
     </div>
    </div>
   </main>
  </div>
  <script src="js/app.js">
  </script>
  <script src="js/verify-page.js">
  </script>
 </body>
</html>
