<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="light dark" name="color-scheme"/>
  <meta content="#f4f7f4" name="theme-color"/>
  <title>
   BhuDrishti AI | Login
  </title>
  <link href="css/base.css" rel="stylesheet"/>
  <link href="css/theme.css" rel="stylesheet"/>
  <script>
   try{document.documentElement.setAttribute('data-theme',localStorage.getItem('bhudrishtiTheme')==='dark'?'dark':'light')}catch(e){}
  </script>
  <link href="css/responsive-fixes.css" rel="stylesheet"/>
  <link href="css/final-polish.css" rel="stylesheet"/>
 </head>
 <body class="page-login">
  <div class="auth-page">
   <section class="auth-visual">
    <div class="auth-brand">
     <a class="logo" href="index.html">
      <span class="logo-mark">
       <svg fill="none" viewbox="0 0 32 32">
        <path d="M5 16c4.4-7.1 10-9.5 16.8-7.2 2.3.8 4.1 2.1 5.2 3.9-3.1 7.5-8.6 11.2-16.5 8.6L5 16Z" stroke="currentColor" stroke-width="2.2">
        </path>
        <circle cx="18" cy="14" fill="currentColor" r="3">
        </circle>
       </svg>
      </span>
      <span>
       <div class="logo-title">
        BHU
        <span>
         DRISHTI
        </span>
       </div>
       <div class="logo-sub">
        AI
       </div>
      </span>
     </a>
    </div>
    <div class="auth-copy">
     <h1 data-i18n="loginVisualTitle">
     </h1>
     <p data-i18n="loginVisualDesc">
     </p>
    </div>
    <div class="auth-foot" data-i18n="loginFoot">
    </div>
   </section>
   <main class="auth-panel">
    <div class="auth-card">
     <div class="auth-top">
      <select class="lang-select" data-lang-select="">
       <option value="en">
        English
       </option>
       <option value="hi">
        हिंदी
       </option>
       <option value="hinglish">
        Hinglish
       </option>
      </select>
      <button aria-label="Theme" class="icon-btn" data-theme-toggle="" type="button">
       <span data-icon="theme">
       </span>
      </button>
     </div>
     <h2 data-i18n="loginTitle">
     </h2>
     <p class="sub" data-i18n="loginSub">
     </p>
     <form id="loginForm">
      <div class="auth-field">
       <label class="field-label" data-i18n="email" for="email">
       </label>
       <input autocomplete="email" class="field" id="email" type="email" value="rohit@example.com"/>
      </div>
      <div class="auth-field">
       <label class="field-label" data-i18n="password" for="password">
       </label>
       <input autocomplete="current-password" class="field" id="password" type="password" value="1234"/>
      </div>
      <div class="error" id="loginError">
      </div>
      <div class="auth-actions">
       <button class="btn btn-primary" data-i18n="login">
       </button>
      </div>
     </form>
     <div class="auth-link">
      <button data-i18n="demo" id="demoLogin" type="button">
      </button>
     </div>
    </div>
   </main>
  </div>
  <script src="js/app.js">
  </script>
  <script src="js/login.js">
  </script>
 </body>
</html>
