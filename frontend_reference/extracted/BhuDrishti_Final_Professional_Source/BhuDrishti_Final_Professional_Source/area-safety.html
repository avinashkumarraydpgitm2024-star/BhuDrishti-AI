<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="light dark" name="color-scheme"/>
  <meta content="#f4f7f4" name="theme-color"/>
  <title>
   BhuDrishti AI
  </title>
  <link href="css/base.css" rel="stylesheet"/>
  <link href="css/theme.css" rel="stylesheet"/>
  <script>
   try{document.documentElement.setAttribute('data-theme',localStorage.getItem('bhudrishtiTheme')==='dark'?'dark':'light')}catch(e){}
  </script>
  <link href="css/responsive-fixes.css" rel="stylesheet"/>
  <link href="css/final-polish.css" rel="stylesheet"/>
 </head>
 <body class="page-safety">
  <div class="app">
   <aside class="sidebar">
    <div class="sidebar-inner">
     <a class="logo" href="home.html">
      <span class="logo-mark">
       <svg fill="none" viewbox="0 0 32 32">
        <path d="M5 16c4.4-7.1 10-9.5 16.8-7.2 2.3.8 4.1 2.1 5.2 3.9-3.1 7.5-8.6 11.2-16.5 8.6L5 16Z" stroke="currentColor" stroke-width="2.2">
        </path>
        <circle cx="18" cy="14" fill="currentColor" r="3">
        </circle>
       </svg>
      </span>
      <span>
       <div class="logo-title">
        BHU
        <span>
         DRISHTI
        </span>
       </div>
       <div class="logo-sub">
        AI
       </div>
      </span>
     </a>
     <div class="sidebar-main">
      <section class="nav-section">
       <div class="nav-label" data-i18n="main">
       </div>
       <nav class="nav-list">
        <a class="nav-item" href="home.html">
         <span class="nav-icon" data-icon="home">
         </span>
         <span class="nav-text" data-i18n="home">
         </span>
        </a>
        <a class="nav-item" href="map.html">
         <span class="nav-icon" data-icon="map">
         </span>
         <span class="nav-text" data-i18n="map">
         </span>
        </a>
        <a class="nav-item" href="alerts.html">
         <span class="nav-icon" data-icon="alerts">
         </span>
         <span class="nav-text" data-i18n="alerts">
         </span>
         <span class="nav-badge" data-alert-badge="" hidden="">
         </span>
        </a>
        <a class="nav-item" href="assistant.html">
         <span class="nav-icon" data-icon="assistant">
         </span>
         <span class="nav-text" data-i18n="assistant">
         </span>
        </a>
        <a class="nav-item active" href="area-safety.html">
         <span class="nav-icon" data-icon="safety">
         </span>
         <span class="nav-text" data-i18n="safety">
         </span>
        </a>
       </nav>
      </section>
      <section class="nav-section">
       <div class="nav-label" data-i18n="tools">
       </div>
       <nav class="nav-list">
        <a class="nav-item" href="change-detection.html">
         <span class="nav-icon" data-icon="change">
         </span>
         <span class="nav-text" data-i18n="change">
         </span>
        </a>
        <a class="nav-item" href="saved-places.html">
         <span class="nav-icon" data-icon="saved">
         </span>
         <span class="nav-text" data-i18n="saved">
         </span>
        </a>
       </nav>
      </section>
     </div>
     <div class="sidebar-account">
      <section class="nav-section">
       <div class="nav-label" data-i18n="account">
       </div>
       <nav class="nav-list">
        <a class="nav-item" href="settings.html">
         <span class="nav-icon" data-icon="settings">
         </span>
         <span class="nav-text" data-i18n="settings">
         </span>
        </a>
        <a class="nav-item" href="help.html">
         <span class="nav-icon" data-icon="help">
         </span>
         <span class="nav-text" data-i18n="help">
         </span>
        </a>
       </nav>
      </section>
     </div>
    </div>
   </aside>
   <div class="mobile-overlay">
   </div>
   <main class="main">
    <header class="topbar">
     <div class="area-box">
      <button aria-label="Menu" class="icon-btn mobile-menu" data-menu-toggle="" type="button">
       <span data-icon="menu">
       </span>
      </button>
      <div class="area-icon" data-icon="pin">
      </div>
      <div style="min-width:0">
       <div class="area-meta" data-i18n="yourArea">
       </div>
       <div class="area-name" data-current-area="">
       </div>
      </div>
     </div>
     <div class="top-actions">
      <select aria-label="Language" class="lang-select" data-lang-select="">
       <option value="en">
        English
       </option>
       <option value="hi">
        हिंदी
       </option>
       <option value="hinglish">
        Hinglish
       </option>
      </select>
      <button aria-label="Theme" class="icon-btn" data-theme-toggle="" type="button">
       <span data-icon="theme">
       </span>
      </button>
      <div class="profile">
       <button class="profile-btn" data-profile-toggle="" type="button">
        <span class="avatar" data-user-initial="">
         R
        </span>
        <span class="profile-copy">
         <span class="profile-small" data-i18n="welcome">
         </span>
         <br/>
         <span class="profile-name" data-user-name="">
          Rohit
         </span>
        </span>
        <span class="profile-chevron" data-icon="chevron">
        </span>
       </button>
       <div class="profile-menu">
        <a href="settings.html">
         <span data-icon="settings">
         </span>
         <span data-i18n="profileMenuSettings">
         </span>
        </a>
        <a href="saved-places.html">
         <span data-icon="saved">
         </span>
         <span data-i18n="profileMenuSaved">
         </span>
        </a>
        <button class="danger" data-logout="" type="button">
         <span data-icon="logout">
         </span>
         <span data-i18n="logout">
         </span>
        </button>
       </div>
      </div>
     </div>
    </header>
    <section class="hero">
     <div class="eyebrow" data-i18n="safety">
     </div>
     <h1 data-i18n="safetyHero">
     </h1>
     <p data-i18n="safetyDesc">
     </p>
     <div class="hero-actions">
      <span class="status-chip chip-low" data-i18n="researchLocations">
      </span>
     </div>
    </section>
    <section class="safety-search-panel">
     <div class="safety-search-copy">
      <div class="eyebrow" data-i18n="checkLocation">
      </div>
      <h2 data-i18n="checkLocation">
      </h2>
      <p data-i18n="searchResearch">
      </p>
     </div>
     <div class="safety-search-box">
      <div class="safety-search-control">
       <span class="search-leading" data-icon="search">
       </span>
       <input autocomplete="off" class="field" data-i18n="searchResearch" data-i18n-attr="placeholder" id="riskSearch" list="riskLocations"/>
       <datalist id="riskLocations">
       </datalist>
       <button class="btn btn-primary" data-i18n="checkSafety" id="riskCheck" type="button">
       </button>
      </div>
      <div class="quick-locations">
       <button class="quick-location" data-risk-location="Chungthang" type="button">
        Chungthang
       </button>
       <button class="quick-location" data-risk-location="Mangan Town" type="button">
        Mangan
       </button>
       <button class="quick-location" data-risk-location="Chandmari, Gangtok" type="button">
        Chandmari
       </button>
       <button class="quick-location" data-risk-location="Rangpo, Teesta River Corridor" type="button">
        Rangpo
       </button>
      </div>
      <div aria-live="polite" class="search-feedback" id="riskSearchFeedback">
      </div>
     </div>
    </section>
    <section class="safety-overview">
     <article class="card risk-primary">
      <div class="risk-primary-top">
       <div class="eyebrow" data-i18n="currentRisk">
       </div>
       <span class="status-chip chip-high" id="riskChip">
       </span>
      </div>
      <div class="risk-primary-main">
       <div class="risk-ring" id="riskRing">
        <div class="risk-ring-inner">
         <div class="risk-num" id="riskScore">
          0
         </div>
         <div class="risk-unit" data-i18n="riskScore">
         </div>
        </div>
       </div>
       <div>
        <div class="risk-title" id="riskLocation">
        </div>
        <div class="risk-district" id="riskDistrict">
        </div>
        <div class="risk-type-label" data-i18n="primaryRisk">
        </div>
        <div class="risk-type" id="riskType">
        </div>
       </div>
      </div>
     </article>
     <article class="card risk-reason-card">
      <div class="eyebrow" data-i18n="whyRisk">
      </div>
      <h2 data-i18n="whyRisk">
      </h2>
      <p class="muted" id="riskReason">
      </p>
     </article>
    </section>
    <section class="detail-grid">
     <article class="card detail-card">
      <div class="eyebrow" data-i18n="warningSigns">
      </div>
      <h3 data-i18n="warningSigns">
      </h3>
      <ul id="warningList">
      </ul>
     </article>
     <article class="card detail-card">
      <div class="eyebrow" data-i18n="safetySteps">
      </div>
      <h3 data-i18n="safetySteps">
      </h3>
      <ul id="safetyList">
      </ul>
     </article>
     <article class="card detail-card">
      <div class="eyebrow" data-i18n="riskReduction">
      </div>
      <h3 data-i18n="riskReduction">
      </h3>
      <p class="muted" id="recoveryText">
      </p>
     </article>
     <article class="card detail-card">
      <div class="eyebrow" data-i18n="safeRoute">
      </div>
      <h3 data-i18n="safeRoute">
      </h3>
      <p class="muted" id="routeText">
      </p>
      <a class="btn btn-secondary" data-i18n="mapOpen" href="map.html" style="margin-top:12px">
      </a>
     </article>
    </section>
    <section class="card source-card">
     <div class="source-copy">
      <div class="eyebrow" data-i18n="officialSource">
      </div>
      <h3 data-i18n="officialSource">
      </h3>
      <div class="source-doc" id="sourceDoc">
      </div>
      <div class="muted" id="sourceNote" style="font-size:11.5px;margin-top:6px">
      </div>
     </div>
     <a class="btn btn-primary" data-i18n="openSource" id="sourceLink" rel="noopener" target="_blank">
     </a>
    </section>
    <div class="notice" data-i18n="datasetNote">
    </div>
    <script src="js/app.js">
    </script>
    <script src="js/risk-data.js">
    </script>
    <script src="js/safety-page.js">
    </script>
   </main>
  </div>
 </body>
</html>
